name: ocr_expense_tracker
description: >-
  OCR Expense Tracker & Receipt Parser — Chụp ảnh biên lai, nhận dạng văn bản
  bằng Google ML Kit, trích xuất thông tin chi tiêu và lưu cục bộ.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Camera & Gallery
  camera: ^0.11.1
  image_picker: ^1.0.7
  permission_handler: ^11.3.1

  # OCR — Google ML Kit (on-device)
  google_mlkit_text_recognition: ^0.14.0

  # Database & Storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Image processing (crop, resize, compress)
  image: ^4.5.3

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
